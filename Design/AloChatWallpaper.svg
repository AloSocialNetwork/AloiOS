<?xml version="1.0" encoding="UTF-8"?>
<!--
  Alo original chat wallpaper.
  Designed from scratch for Alo; this source intentionally contains no third-party artwork.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2960" viewBox="0 0 1440 2960" fill="none">
  <title>Alo quiet network wallpaper</title>
  <metadata>Copyright 2026 Alo contributors. Original artwork.</metadata>
  <defs>
    <pattern id="alo-network" width="720" height="740" patternUnits="userSpaceOnUse">
      <g stroke="#D9EEFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.42">
        <!-- Linked waypoints -->
        <g transform="translate(54 58)">
          <path d="M0 62 58 24 121 49 164 0"/>
          <path d="M58 24 70 102 143 128"/>
          <circle cx="0" cy="62" r="12"/>
          <circle cx="58" cy="24" r="12"/>
          <circle cx="121" cy="49" r="12"/>
          <circle cx="164" cy="0" r="12"/>
          <circle cx="70" cy="102" r="12"/>
          <circle cx="143" cy="128" r="12"/>
        </g>

        <!-- Conversation signal, rendered as abstract stacked rails -->
        <g transform="translate(374 58)">
          <rect x="0" y="0" width="218" height="100" rx="30"/>
          <path d="M38 34H180M38 50H136M38 66H158"/>
          <circle cx="176" cy="66" r="10"/>
        </g>

        <!-- An orbital presence marker -->
        <g transform="translate(572 210)">
          <circle cx="55" cy="55" r="17"/>
          <path d="M16 83C-4 52 9 16 43 4 78-9 111 13 116 48"/>
          <path d="M94 27C118 57 100 99 65 111 31 123-2 101-6 67"/>
          <circle cx="113" cy="48" r="7" fill="#D9EEFF" stroke="none"/>
          <circle cx="-5" cy="67" r="7" fill="#D9EEFF" stroke="none"/>
        </g>

        <!-- Focus corners -->
        <g transform="translate(72 258)">
          <path d="M0 38V0H38M162 0H200V38M200 162V200H162M38 200H0V162"/>
          <rect x="48" y="48" width="104" height="104" rx="24"/>
          <path d="M72 100H128M100 72V128"/>
        </g>

        <!-- A calm route with an offset destination -->
        <g transform="translate(344 302)">
          <path d="M0 98H57C85 98 101 81 101 54S117 10 145 10H236"/>
          <circle cx="0" cy="98" r="11"/>
          <circle cx="236" cy="10" r="11"/>
          <path d="M171 10 197 36 171 62"/>
        </g>

        <!-- Nested cards, deliberately geometric rather than pictorial -->
        <g transform="translate(82 534)">
          <rect x="0" y="20" width="182" height="118" rx="28"/>
          <rect x="30" y="0" width="182" height="118" rx="28"/>
          <path d="M63 43H178M63 67H145M63 91H164"/>
          <circle cx="178" cy="91" r="10"/>
        </g>

        <!-- Soft chevrons and a pulse line -->
        <g transform="translate(420 534)">
          <path d="M0 52 34 18 68 52 102 18 136 52 170 18"/>
          <path d="M0 102H31L48 78 73 128 96 94H170"/>
          <circle cx="0" cy="102" r="9"/>
          <circle cx="170" cy="94" r="9"/>
        </g>

        <!-- Small quiet markers to keep the repeat from looking tiled -->
        <circle cx="299" cy="60" r="7" fill="#D9EEFF" stroke="none"/>
        <circle cx="308" cy="196" r="5" fill="#D9EEFF" stroke="none"/>
        <circle cx="324" cy="466" r="8" fill="#D9EEFF" stroke="none"/>
        <circle cx="635" cy="472" r="6" fill="#D9EEFF" stroke="none"/>
        <circle cx="46" cy="454" r="6" fill="#D9EEFF" stroke="none"/>
        <circle cx="653" cy="675" r="7" fill="#D9EEFF" stroke="none"/>
        <circle cx="306" cy="692" r="5" fill="#D9EEFF" stroke="none"/>
      </g>
    </pattern>
  </defs>
  <rect width="1440" height="2960" fill="url(#alo-network)"/>
</svg>
